services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    pull_policy: never
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 5s
  backend-api:
    image: rcu-deploy-backend:8a54bb16-linux-arm64
    container_name: backend-api
    restart: always
    pull_policy: never
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command: python main.py
    ports:
    - 8000:8000
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DEBUG: '0'
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      VDR_IP_ADDRESS: 10.2.1.10
      VDR_PORT: '8080'
      DIMMING_FILE: /app/files_from_vdr/dimming.json
      RCU_SERVICE_URL: http://frontend:80/service
    volumes:
    - /app/app/files_from_vdr:/app/app/files_from_vdr
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        || exit 1
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 15s
  celery-worker:
    image: rcu-deploy-backend:8a54bb16-linux-arm64
    container_name: celery-worker
    restart: always
    pull_policy: never
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command: celery -A app.celery worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DEBUG: '0'
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      VDR_IP_ADDRESS: 10.2.1.10
      VDR_PORT: '8080'
      DIMMING_FILE: /app/files_from_vdr/dimming.json
      RCU_SERVICE_URL: http://frontend:80/service
  frontend:
    image: rcu-deploy-frontend:8a54bb16-linux-arm64
    container_name: frontend
    restart: always
    pull_policy: never
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
    - 80:80
    extra_hosts:
    - host.docker.internal:172.17.0.1
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80/
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 10s
volumes:
  redis_data: null
